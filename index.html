<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Referenced from `src/`, not from `publicDir`: `vite.config.ts` points `publicDir` at `data/`,
      which holds the generated dataset and nothing else. Vite rewrites this href at build time and
      emits the file into `dist/assets/`, so the icon ships without a second static directory.
    -->
    <link rel="icon" type="image/x-icon" href="./src/favicon.ico" />
    <title>KNUE PICK — 동료들이 자주 찾은 식당과 카페</title>
    <meta
      name="description"
      content="한국교원대학교 업무추진비 공개자료로 살펴보는, 교직원이 많이 이용한 음식점과 카페"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
